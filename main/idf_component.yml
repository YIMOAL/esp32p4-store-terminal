## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=5.5.3'
  espressif/esp32_p4_function_ev_board_noglib:
    version: 5.2.*
    public: true
  lvgl/lvgl:
    version: 9.4.*
    public: true
  espressif/esp_lvgl_adapter:
    version: 0.3.*
    public: true
  chmorgan/esp-audio-player:
    version: 1.0.*
    public: true
  chmorgan/esp-file-iterator:
    version: 1.0.0
    public: true
  espressif/esp_hosted:
    rules:
    - if: target in [esp32p4]
    version: '*'
  espressif/esp_wifi_remote:
    rules:
    - if: target in [esp32p4]
    - if: idf_version <6.1
    version: '>=1.3.1'
